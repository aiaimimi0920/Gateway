# 仓库配置只保留路由目录，不保存真实凭据；桌面账户仍由用户 .ng 管理。
# api_key/auth_token/headers 可使用环境变量；未设置的引用不会自动报错。
# extra_body.token/session 不支持环境替换，已置空；需要时只在私密配置中填写。
providers:
  - id: codex
    vendor_key: openai
    vendor_name: "OpenAI"
    preset: codex
    base_url: "https://chatgpt.com/backend-api/codex"
    api_key: "${GATEWAY_CODEX_API_KEY}"
    headers:
      Chatgpt-Account-Id: "06cdac4a-6c5a-4e5e-9b6b-8d3cdc1efd8b"
    supported_models:
      - gpt-5.4
      - gpt-5.4-mini
      - gpt-5.3-codex
      - gpt-5.2

  - id: muyuan-openai
    label: "Muyuan · 第三方 OpenAI 兼容"
    vendor_key: muyuan
    vendor_name: "Muyuan"
    preset: muyuan-openai
    base_url: "https://muyuan.do/v1"
    api_key: "${GATEWAY_MUYUAN_OPENAI_API_KEY}"
    chat_completions_path: "/chat/completions"
    supported_models: [gpt-5.4]

  - id: accio
    vendor_key: alibaba
    vendor_name: "Alibaba"
    preset: accio
    base_url: "https://phoenix-gw.alibaba.com"
    supported_models: [claude-sonnet-4-6, claude-opus-4-6]
    credentials:
      - extra_body: { token: "", utdid: "utd-1775547724148-cdf1abd02b7b298c" }
        headers: { x-utdid: "utd-1775547724148-cdf1abd02b7b298c" }

  # 讯飞星辰 MaaS — v2 端点，标准 OpenAI 兼容
  - id: xfyun-maas
    vendor_key: xfyun
    vendor_name: "iFlytek / XFYun"
    preset: openai
    base_url: "https://maas-api.cn-huabei-1.xf-yun.com"
    chat_completions_path: "/v2/chat/completions"
    supported_models: [xop35qwen2b, xophunyuan7bmt, xophunyuanocr, xopqwen35v35b]
    model_map:
      hunyuan-mt-7b: "xophunyuan7bmt"
      hunyuan-ocr: "xophunyuanocr"
      qwen-2b: "xop35qwen2b"
      qwen3.5-35b: "xopqwen35v35b"
    credentials:
      - api_key: "${GATEWAY_XFYUN_MAAS_CREDENTIAL_1_API_KEY}"
        supported_models: [xop35qwen2b]
      - api_key: "${GATEWAY_XFYUN_MAAS_CREDENTIAL_2_API_KEY}"
        supported_models: [xop35qwen2b, xophunyuan7bmt, xophunyuanocr]
      - api_key: "${GATEWAY_XFYUN_MAAS_CREDENTIAL_3_API_KEY}"
        supported_models: [xopqwen35v35b]

  - id: nvidia
    vendor_key: nvidia
    vendor_name: "NVIDIA"
    preset: nvidia-openai
    base_url: "https://integrate.api.nvidia.com"
    supported_models:
      - deepseek-ai/deepseek-v3.2
      - deepseek-ai/deepseek-v3.1
      - deepseek-ai/deepseek-r1-distill-qwen-32b
      - moonshotai/kimi-k2.5
      - moonshotai/kimi-k2-instruct
      - nvidia/nemotron-3-super-120b-a12b
      - nvidia/llama-3.3-nemotron-super-49b-v1.5
      - meta/llama-3.3-70b-instruct
      - meta/llama-4-maverick-17b-128e-instruct
      - qwen/qwen3.5-397b-a17b
      - qwen/qwen3-coder-480b-a35b-instruct
      - qwen/qwen3-next-80b-a3b-thinking
      - z-ai/glm5
      - z-ai/glm4.7
      - minimaxai/minimax-m2.5
      - mistralai/codestral-22b-instruct-v0.1
    credentials:
      - api_key: "${GATEWAY_NVIDIA_CREDENTIAL_1_API_KEY}"

  # Poe — OpenAI 兼容, Bearer 认证, 多凭证轮询
  - id: poe
    vendor_key: poe
    vendor_name: "Poe"
    preset: poe-openai
    base_url: "https://api.poe.com"
    supported_models: [Gemma-4-31B, Claude-Sonnet-4.6]
    credentials:
      - api_key: "${GATEWAY_POE_CREDENTIAL_1_API_KEY}"

  # OpenRouter — 统一 AI 模型聚合平台, OpenAI 兼容, 多凭证轮询
  # 注意: base_url 路径含 /api 前缀 (openrouter.ai/api/v1/...)
  # 可选头: HTTP-Referer, X-Title (用于 OpenRouter 排名)
  - id: openrouter
    vendor_key: openrouter
    vendor_name: "OpenRouter"
    preset: openai
    base_url: "https://openrouter.ai/api"
    supported_models:
      - google/gemma-4-26b-a4b-it:free
      - nvidia/nemotron-3-super-120b-a12b:free
      - nvidia/llama-nemotron-embed-vl-1b-v2:free
    headers:
      HTTP-Referer: "https://neuroplatform.app"
      X-Title: "NeuroPlatform"
    credentials:
      - api_key: "${GATEWAY_OPENROUTER_CREDENTIAL_1_API_KEY}"

  # LongCat — 美团 AI, OpenAI 兼容, base_url 含 /openai 前缀
  - id: longcat
    vendor_key: longcat
    vendor_name: "LongCat"
    preset: longcat-openai
    base_url: "https://api.longcat.chat/openai"
    supported_models:
      - LongCat-2.0
    credentials:
      - api_key: "${GATEWAY_LONGCAT_CREDENTIAL_1_API_KEY}"

  # Qwen Platform — official API key lines + WebUI reverse surface
  - id: qwen-dashscope-openai
    vendor_key: alibaba-qwen
    vendor_name: "Alibaba / Qwen"
    preset: qwen-dashscope-openai
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    supported_models: [qwen3-coder-plus, qwen-plus, qwen-turbo]
    credentials:
      - api_key: "${QWEN_DASHSCOPE_API_KEY}"

  - id: qwen-coding-plan-openai
    vendor_key: alibaba-qwen
    vendor_name: "Alibaba / Qwen"
    preset: qwen-coding-plan-openai
    base_url: "https://coding.dashscope.aliyuncs.com/v1"
    supported_models: [qwen3-coder-plus, qwen3-max-preview]
    credentials:
      - api_key: "${QWEN_CODING_PLAN_API_KEY}"

  - id: qwen-coding-plan-anthropic
    vendor_key: alibaba-qwen
    vendor_name: "Alibaba / Qwen"
    preset: qwen-coding-plan-anthropic
    base_url: "https://coding.dashscope.aliyuncs.com/apps/anthropic"
    supported_models: [qwen3-coder-plus, qwen3-max-preview]
    credentials:
      - api_key: "${QWEN_CODING_PLAN_API_KEY}"

  - id: qwen-web-chat
    vendor_key: alibaba-qwen
    vendor_name: "Alibaba / Qwen"
    preset: qwen-web-chat
    base_url: "https://chat.qwen.ai"
    supported_models: [qwen3-coder-plus]
    credentials:
      - api_key: "${QWEN_WEB_SESSION_TOKEN}"
        headers:
          Cookie: "${QWEN_WEB_COOKIE}"

  - id: gemini-business
    vendor_key: google-gemini
    vendor_name: "Google / Gemini"
    preset: gemini-business
    base_url: "https://biz-discoveryengine.googleapis.com/v1alpha"
    supported_models: [nano-banana-pro, gemini-3-pro-image-preview]
    session_auth:
      transport: "bearer"
      header_name: "Authorization"
    keepalive:
      service_url: "${AI_GATEWAY_KEEPALIVE_URL}"
      refresh_before_secs: 300
    credentials:
      - api_key: "${GEMINI_BUSINESS_JWT}"
        extra_body:
          configId: "${GEMINI_BUSINESS_CONFIG_ID}"
          session: ""

  - id: linkup
    vendor_key: linkup
    vendor_name: "Linkup"
    preset: linkup
    base_url: "https://api.linkup.so"
    supported_models: [linkup-search, linkup-fetch, linkup-research, linkup-balance]
    credentials:
      - api_key: "${LINKUP_API_KEY_1}"

  - id: tavily
    vendor_key: tavily
    vendor_name: "Tavily"
    preset: tavily
    base_url: "https://api.tavily.com"
    supported_models: [tavily-search]
    credentials:
      - api_key: "${TAVILY_API_KEY}"

  - id: you
    vendor_key: you
    vendor_name: "You.com"
    preset: you
    base_url: "https://ydc-index.io"
    supported_models: [you-search]
    credentials:
      - api_key: "${YOU_API_KEY}"

  - id: exa
    vendor_key: exa
    vendor_name: "Exa"
    preset: exa
    base_url: "https://api.exa.ai"
    supported_models: [exa-search, exa-fetch]
    credentials:
      - api_key: "${EXA_API_KEY_1}"

  - id: jina-search
    vendor_key: jina-ai
    vendor_name: "Jina AI"
    preset: jina-search
    base_url: "https://s.jina.ai"
    supported_models: [jina-search]
    credentials:
      - api_key: "${JINA_API_KEY_1}"

  - id: jina-reader
    vendor_key: jina-ai
    vendor_name: "Jina AI"
    preset: jina-reader
    base_url: "https://r.jina.ai"
    supported_models: [jina-fetch]
    credentials:
      - api_key: "${JINA_API_KEY_1}"

  - id: websearchapi
    vendor_key: websearchapi
    vendor_name: "WebSearchAPI"
    preset: websearchapi
    base_url: "https://api.websearchapi.ai"
    supported_models: [websearchapi-search]
    credentials:
      - api_key: "${WEBSEARCHAPI_API_KEY}"

  - id: chataibot
    vendor_key: chataibot
    vendor_name: "ChatAIBot"
    preset: chataibot
    base_url: "https://chataibot.pro"
    supported_models:
      - gpt-image-1.5
      - gpt-image-1.5-high
      - ideogram
      - google-nano-banana-pro
      - google-nano-banana
      - google-nano-banana-2
      - midjourney-7
      - qwen-lora
      - bytedance-seedream
    keepalive:
      service_url: "${AI_GATEWAY_KEEPALIVE_URL}"
      refresh_before_secs: 300
    credentials:
      - api_key: "${CHATAIBOT_TOKEN}"

  - id: lumalabs
    vendor_key: luma-ai
    vendor_name: "Luma AI"
    preset: lumalabs
    base_url: "https://app.lumalabs.ai"
    supported_models: [uni-1, ray3.14, elevenlabs-music-v1]
    keepalive:
      service_url: "${AI_GATEWAY_KEEPALIVE_URL}"
      refresh_before_secs: 300
    credentials:
      - api_key: "${LUMALABS_WOS_SESSION}"
        extra_body:
          realmId: "${LUMALABS_REALM_ID}"
          # Optional reverse-web overrides captured from the current Luma app:
          # videoActionType: "${LUMALABS_VIDEO_ACTION_TYPE}"
          # videoArtifactField: "${LUMALABS_VIDEO_ARTIFACT_FIELD}"
          # audioActionType: "${LUMALABS_AUDIO_ACTION_TYPE}"
          # audioArtifactField: "${LUMALABS_AUDIO_ARTIFACT_FIELD}"

  - id: gemini-canvas
    vendor_key: google-gemini
    vendor_name: "Google / Gemini"
    preset: gemini-canvas
    base_url: "https://gemini.google.com"
    supported_models:
      - gemini-2.5-flash-image-preview
      - gemini-2.5-flash-image
      - gemini-3.1-flash-image-preview
      - gemini-canvas-music-preview
      - gemini-canvas-video-preview
    keepalive:
      service_url: "${AI_GATEWAY_KEEPALIVE_URL}"
      refresh_before_secs: 300
    credentials:
      - api_key: ""
        account_name: "canvas-main"
        runtime_state_object_key: "${GEMINI_CANVAS_RUNTIME_STATE_OBJECT_KEY}"
        extra_body:
          shareId: "${GEMINI_CANVAS_SHARE_ID}"

  - id: gemini-canvas-chat
    vendor_key: google-gemini
    vendor_name: "Google / Gemini"
    preset: gemini-canvas-chat
    base_url: "https://gemini.google.com"
    supported_models:
      - gemini-3-flash-preview
      - gemini-2.5-flash
      - gemini-2.5-flash-preview-tts
    keepalive:
      service_url: "${AI_GATEWAY_KEEPALIVE_URL}"
      refresh_before_secs: 300
    credentials:
      - api_key: ""
        account_name: "canvas-chat-main"
        runtime_state_object_key: "${GEMINI_CANVAS_RUNTIME_STATE_OBJECT_KEY}"
        extra_body:
          shareId: "${GEMINI_CANVAS_SHARE_ID}"
          apiBaseUrl: "https://generativelanguage.googleapis.com/v1beta"

  - id: producer
    vendor_key: producer
    vendor_name: "Producer"
    preset: producer
    base_url: "https://www.flowmusic.app"
    supported_models: [producer:image, producer:standard, producer:music-video]
    credentials:
      - api_key: "${PRODUCER_SESSION_BEARER_1}"

  - id: suno
    vendor_key: suno
    vendor_name: "Suno"
    preset: suno
    execution_mode: browser_backed
    base_url: "https://studio-api-prod.suno.com"
    supported_models: [chirp-v3-5, chirp-v3-0]
    keepalive:
      service_url: "${AI_GATEWAY_KEEPALIVE_URL}"
      refresh_before_secs: 300
    credentials:
      - api_key: "${SUNO_COOKIE_1}"
        runtime_state_object_key: "credential-runtime/suno/manual-browser-helper/storage-state.json"

  - id: udio
    vendor_key: udio
    vendor_name: "Udio"
    preset: udio
    base_url: "https://www.udio.com"
    supported_models: [udio-music]
    keepalive:
      service_url: "${AI_GATEWAY_KEEPALIVE_URL}"
      refresh_before_secs: 300
    credentials:
      - api_key: "${UDIO_COOKIE_1}"
        account_name: "manual-bootstrap"
        runtime_state_object_key: "credential-runtime/udio/manual-browser-helper/storage-state.json"

model_routes:
  - pattern: "gpt-5.4"
    provider_ids: [muyuan-openai]
    priority: 100

  - pattern: "gpt-5-codex-*"
    provider_ids: [codex]
    priority: 20
  - pattern: "claude-*"
    provider_ids: [accio]
    priority: 10
  - pattern: "xop*"
    provider_ids: [xfyun-maas]
    priority: 10
  - pattern: "hunyuan-*"
    provider_ids: [xfyun-maas]
    priority: 10
  - pattern: "deepseek-ai/*"
    provider_ids: [nvidia]
    priority: 10
  - pattern: "moonshotai/*"
    provider_ids: [nvidia]
    priority: 10
  - pattern: "nvidia/*"
    provider_ids: [nvidia]
    priority: 10
  - pattern: "meta/*"
    provider_ids: [nvidia]
    priority: 10
  - pattern: "qwen/*"
    provider_ids: [nvidia]
    priority: 10
  - pattern: "z-ai/*"
