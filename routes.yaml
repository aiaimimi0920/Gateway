  - pattern: "gemini-3-pro-image-preview"
    provider_ids: [gemini-business]
    priority: 10
  - pattern: "gpt-image-1.5*"
    provider_ids: [chataibot]
    priority: 10
  - pattern: "ideogram"
    provider_ids: [chataibot]
    priority: 10
  - pattern: "google-nano-banana*"
    provider_ids: [chataibot]
    priority: 10
  - pattern: "midjourney-7"
    provider_ids: [chataibot]
    priority: 10
  - pattern: "qwen-lora"
    provider_ids: [chataibot]
    priority: 10
  - pattern: "bytedance-seedream"
    provider_ids: [chataibot]
    priority: 10
  - pattern: "uni-1"
    provider_ids: [lumalabs]
    priority: 10
  - pattern: "gemini-2.5-flash-image-preview"
    provider_ids: [gemini-canvas]
    priority: 10
  - pattern: "gemini-2.5-flash-image"
    provider_ids: [gemini-canvas]
    priority: 10
  - pattern: "gemini-3.1-flash-image-preview"
    provider_ids: [gemini-canvas]
    priority: 10
  - pattern: "gemini-canvas-music-preview"
    provider_ids: [gemini-canvas]
    priority: 10
  - pattern: "gemini-canvas-video-preview"
    provider_ids: [gemini-canvas]
    priority: 10
  - pattern: "gemini-3-flash-preview"
    provider_ids: [gemini-canvas-chat]
    priority: 10
  - pattern: "gemini-2.5-flash"
    provider_ids: [gemini-canvas-chat]
    priority: 10
  - pattern: "gemini-2.5-flash-preview-tts"
    provider_ids: [gemini-canvas-chat]
    priority: 10
  - pattern: "producer:*"
    provider_ids: [producer]
    priority: 10
  - pattern: "chirp-*"
    provider_ids: [suno]
    priority: 10
  - pattern: "udio-*"
    provider_ids: [udio]
    priority: 10
  - pattern: "linkup-*"
    provider_ids: [linkup]
