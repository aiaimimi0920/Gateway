services:
  gateway:
    image: ghcr.io/aiaimimi0920/gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file:
      - ${GATEWAY_ENV_FILE:-.env}
    environment:
      - PORT=4200
      # The host publish address must not restrict the container listener.
      - GATEWAY_BIND_HOST=0.0.0.0
      - RUST_LOG=${RUST_LOG:-info}
      - GATEWAY_RUNTIME_ROLE=${GATEWAY_RUNTIME_ROLE:-standalone}
      - GATEWAY_REDIS_URL=${GATEWAY_REDIS_URL:-redis://redis:6379/0}
      - GATEWAY_ROUTES_FILE=${GATEWAY_ROUTES_FILE:-/data/routes.yaml}
      - GATEWAY_STATE_DIR=${GATEWAY_STATE_DIR:-/data/state}
      - GATEWAY_API_KEY=${GATEWAY_API_KEY:-}
      - GATEWAY_API_KEY_SECRET=${GATEWAY_API_KEY_SECRET:-}
      - GATEWAY_MANAGEMENT_TOKEN=${GATEWAY_MANAGEMENT_TOKEN-11011101}
      - GATEWAY_CONSOLE_REMOTE_ACCESS=${GATEWAY_CONSOLE_REMOTE_ACCESS:-false}
      - GATEWAY_DATABASE_URL=${GATEWAY_DATABASE_URL:-postgres://gateway:gateway@postgres:5432/gateway}
    ports:
      - "${GATEWAY_BIND_HOST:-0.0.0.0}:${GATEWAY_PORT:-4200}:4200"
    volumes:
      - ./gateway_data:/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4200/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - gateway-network

  # The gateway keeps its request audits, usage aggregates and per-credential
  # model states in PostgreSQL. Without it the console's live concurrency, cost
  # and success-rate panels answer 503 "PostgreSQL 尚未配置", so the stack ships
  # its own database instead of expecting an external one.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${GATEWAY_POSTGRES_USER:-gateway}
      - POSTGRES_PASSWORD=${GATEWAY_POSTGRES_PASSWORD:-gateway}
      - POSTGRES_DB=${GATEWAY_POSTGRES_DB:-gateway}
    volumes:
      - gateway_postgres_data:/var/lib/postgresql/data
      # Applied once, when the data directory is first initialised.
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${GATEWAY_POSTGRES_USER:-gateway} -d ${GATEWAY_POSTGRES_DB:-gateway}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - gateway-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--save",
        "60",
        "1",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
      ]
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - gateway-network

volumes:
  gateway_postgres_data:
    driver: local

networks:
  gateway-network:
    driver: bridge
