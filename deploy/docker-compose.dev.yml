x-gateway-dev-build: &gateway-dev-build
  context: ..
  dockerfile: Dockerfile.dev

services:
  gateway-build:
    build: *gateway-dev-build
    image: ${GATEWAY_DEV_IMAGE:-neuro-gateway-dev:local}
    restart: "no"
    init: true
    environment:
      - GATEWAY_PREBUILT_WEB_UI=1
      - GATEWAY_DEV_MODE=build
      - GATEWAY_DEV_CARGO_BUILD_JOBS=${GATEWAY_DEV_CARGO_BUILD_JOBS:-4}
      - GATEWAY_DEV_CARGO_INCREMENTAL=${GATEWAY_DEV_CARGO_INCREMENTAL:-1}
      - GATEWAY_DEV_RUN_AUDIT=${GATEWAY_DEV_RUN_AUDIT:-0}
    entrypoint: ["gateway-dev-entrypoint"]
    volumes:
      - ..:/workspace
      - gateway-dev-target:/workspace/target
      - gateway-dev-node-modules:/workspace/apps/desktop/node_modules
      - gateway-dev-scripts-node-modules:/workspace/scripts/node_modules
      - gateway-dev-cargo-registry:/root/.cargo/registry
      - gateway-dev-cargo-git:/root/.cargo/git
      - gateway-dev-npm-cache:/root/.npm
    networks:
      - gateway-network

  gateway:
    image: ${GATEWAY_DEV_IMAGE:-neuro-gateway-dev:local}
    restart: unless-stopped
    init: true
    env_file:
      - ${GATEWAY_ENV_FILE:-.env}
    environment:
      - PORT=4200
      # The host publish address must not restrict the container listener.
      - GATEWAY_BIND_HOST=0.0.0.0
      - RUST_LOG=${RUST_LOG:-info}
      - GATEWAY_RUNTIME_ROLE=${GATEWAY_RUNTIME_ROLE:-standalone}
      - GATEWAY_REDIS_URL=${GATEWAY_REDIS_URL:-redis://redis:6379/0}
      - GATEWAY_ROUTES_FILE=${GATEWAY_ROUTES_FILE:-/data/routes.yaml}
      - GATEWAY_STATE_DIR=${GATEWAY_STATE_DIR:-/data/state}
      - GATEWAY_API_KEY=${GATEWAY_API_KEY:-}
      - GATEWAY_API_KEY_SECRET=${GATEWAY_API_KEY_SECRET:-}
      - GATEWAY_LIVE_ROUTE_PROOF_ENABLED=${GATEWAY_LIVE_ROUTE_PROOF_ENABLED:-false}
      - GATEWAY_MANAGEMENT_TOKEN=${GATEWAY_MANAGEMENT_TOKEN-11011101}
      - GATEWAY_CONSOLE_REMOTE_ACCESS=${GATEWAY_CONSOLE_REMOTE_ACCESS:-true}
      - GATEWAY_DATABASE_URL=${GATEWAY_DATABASE_URL:-postgres://gateway:gateway@postgres:5432/gateway}
      - GATEWAY_GEMINI_AUTH_EXECUTOR_BASE_URL=${GATEWAY_GEMINI_AUTH_EXECUTOR_BASE_URL:-http://host.docker.internal:42341}
      - GATEWAY_GEMINI_AUTH_EXECUTOR_BEARER_TOKEN=${GATEWAY_GEMINI_AUTH_EXECUTOR_BEARER_TOKEN:-gateway-gemini-auth-dev}
      - GATEWAY_BROWSER_EXECUTOR_BASE_URL=${GATEWAY_BROWSER_EXECUTOR_BASE_URL:-http://host.docker.internal:42341}
      - GATEWAY_BROWSER_EXECUTOR_BEARER_TOKEN=${GATEWAY_BROWSER_EXECUTOR_BEARER_TOKEN:-gateway-gemini-auth-dev}
      - GEMINI_CANVAS_BROWSER_POOL_BASE_URL=${GEMINI_CANVAS_BROWSER_POOL_BASE_URL:-}
      - GATEWAY_PREBUILT_WEB_UI=1
      - GATEWAY_DEV_CARGO_BUILD_JOBS=${GATEWAY_DEV_CARGO_BUILD_JOBS:-4}
      - GATEWAY_DEV_CARGO_INCREMENTAL=${GATEWAY_DEV_CARGO_INCREMENTAL:-1}
      - GATEWAY_DEV_RUN_AUDIT=${GATEWAY_DEV_RUN_AUDIT:-0}
      - GATEWAY_DEV_WATCH=${GATEWAY_DEV_WATCH:-0}
      - GATEWAY_DEV_MODE=run
    entrypoint: ["gateway-dev-entrypoint"]
    ports:
      - "${GATEWAY_BIND_HOST:-0.0.0.0}:${GATEWAY_PORT:-4200}:4200"
    volumes:
      - ..:/workspace
      - ./gateway_data:/data
      - gateway-dev-target:/workspace/target
      - gateway-dev-node-modules:/workspace/apps/desktop/node_modules
      - gateway-dev-scripts-node-modules:/workspace/scripts/node_modules
      - gateway-dev-cargo-registry:/root/.cargo/registry
      - gateway-dev-cargo-git:/root/.cargo/git
      - gateway-dev-npm-cache:/root/.npm
    depends_on:
      gateway-build:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gateway-network

  # The gateway keeps its request audits, usage aggregates and per-credential
  # model states in PostgreSQL. Without it the console's live concurrency, cost
  # and success-rate panels answer 503 "PostgreSQL 尚未配置", so the dev stack
  # ships its own database instead of borrowing one from another stack.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${GATEWAY_POSTGRES_USER:-gateway}
      - POSTGRES_PASSWORD=${GATEWAY_POSTGRES_PASSWORD:-gateway}
      - POSTGRES_DB=${GATEWAY_POSTGRES_DB:-gateway}
    volumes:
      - gateway-dev-postgres:/var/lib/postgresql/data
      # Applied once, when the data directory is first initialised.
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${GATEWAY_POSTGRES_USER:-gateway} -d ${GATEWAY_POSTGRES_DB:-gateway}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - gateway-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--save",
        "60",
        "1",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
      ]
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - gateway-network

volumes:
  gateway-dev-postgres:
  gateway-dev-target:
  gateway-dev-node-modules:
  gateway-dev-scripts-node-modules:
  gateway-dev-cargo-registry:
  gateway-dev-cargo-git:
  gateway-dev-npm-cache:

networks:
  gateway-network:
    driver: bridge
