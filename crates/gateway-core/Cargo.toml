[package]
name = "gateway-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
license = "MIT"
publish = false

[features]
cpa-rust-transport = ["dep:gateway-cpa-http-transport"]

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
base64 = "0.22"
dashmap = "6"
futures = "0.3"
gateway-cpa-http-transport = { path = "../cpa-http-transport", optional = true }
hmac = "0.12"
httpdate = "1.0.3"
parking_lot = "0.12"
rand = "0.8"
regex = "1"
reqwest = { version = "=0.12.28", default-features = false, features = ["native-tls", "rustls-tls-native-roots", "http2", "stream", "json", "system-proxy"] }
rquest = { package = "wreq", version = "=0.16.1", default-features = false, features = ["webpki-roots", "tokio-rt", "stream", "json", "form", "query", "charset", "system-proxy", "gzip", "brotli", "deflate", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
thiserror = "1"
time = { version = "0.3", features = ["serde", "parsing", "formatting"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
