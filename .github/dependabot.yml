version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/apps/desktop/src-tauri"
      - "/crates/gateway-local-data"
      - "/crates/gateway-sqlx"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 4
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      rust-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
        group-by: dependency-name
  - package-ecosystem: npm
    directories:
      - "/apps/desktop"
      - "/scripts"
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 4
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      node-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
        group-by: dependency-name
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
