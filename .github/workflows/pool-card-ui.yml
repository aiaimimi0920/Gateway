name: Provider pool card UI

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/pool-card-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pool-card:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --prefix apps/desktop --no-audit --no-fund
      - name: Typecheck and build the real frontend
        working-directory: apps/desktop
        run: npm run typecheck && npm run build:web
      - name: Install Chromium
        working-directory: apps/desktop
        run: npx playwright install --with-deps chromium
      - name: Check provider card interactions and layout
        working-directory: apps/desktop
        env:
          GATEWAY_E2E_CAPTURE_CARDS: '1'
        run: npx playwright test e2e/console.pool.spec.ts --grep 'flips a provider pool card' --workers=1
      - name: Preserve real browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: provider-pool-card-ui
          path: |
            apps/desktop/output/playwright/provider-card-back-desktop-chromium.png
            apps/desktop/output/playwright/provider-card-back-mobile-chromium.png
            apps/desktop/output/playwright/provider-cloud-*.png
            apps/desktop/test-results/
          if-no-files-found: error
          retention-days: 14
