name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 18 * * 0"
  workflow_dispatch:
    inputs:
      ref:
        description: Optional branch, tag, or commit to scan
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: Branch, tag, or commit to resolve before scanning
        required: false
        type: string
        default: ""
      enforce_findings:
        description: Strict release gate; development callers explicitly opt out
        type: boolean
        default: true
    outputs:
      source_sha:
        description: Immutable commit checked by every security job
        value: ${{ jobs.policy.outputs.source_sha }}
      findings_free:
        description: True only when both validated scanners found no issues
        value: ${{ jobs.dependencies.outputs.findings_free == 'true' && jobs.secrets.outputs.findings_free == 'true' }}

concurrency:
  group: gateway-security-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  policy:
    name: Validate security coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.revision.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Resolve immutable source revision
        id: revision
        shell: bash
        run: |
          source_sha="$(git rev-parse --verify HEAD)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
      - run: node --test scripts/tests/security-ci-policy.test.mjs scripts/tests/security-release-gates.test.mjs scripts/tests/security-report.test.mjs scripts/tests/development-quality.test.mjs

  dependencies:
    name: Scan all committed dependency locks
    needs: policy
    uses: ./.github/workflows/osv-scan.yml
    with:
      ref: ${{ needs.policy.outputs.source_sha }}
      enforce_findings: ${{ toJSON(inputs.enforce_findings) == 'true' }}
    permissions:
      actions: read
      contents: read
      security-events: write

  secrets:
    name: Scan repository secrets
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      findings_free: ${{ steps.scan.outputs.findings_free }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.policy.outputs.source_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
      - name: Install verified Gitleaks 8.24.3
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan immutable commit history and validate redacted SARIF
        id: scan
        run: node scripts/security-scan.mjs gitleaks "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/gateway-gitleaks"
      - name: Preserve validated redacted findings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-${{ github.workflow }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gateway-gitleaks
          if-no-files-found: error
      - name: Enforce findings for release callers
        if: inputs.enforce_findings && steps.scan.outputs.findings_free != 'true'
        run: |
          echo "Release blocked by validated secret findings; see redacted report."
          exit 1
