name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 18 * * 0"
  workflow_dispatch:

concurrency:
  group: gateway-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  policy:
    name: Validate security coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
      - run: node --test scripts/tests/security-ci-policy.test.mjs

  dependencies:
    name: Scan all committed dependency locks
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@ffa0a5f39214d80778c9b494822d94d0d9668458
    with:
      ref: ${{ github.ref }}
      scan-args: |-
        --lockfile=./Cargo.lock
        --lockfile=./apps/desktop/src-tauri/Cargo.lock
        --lockfile=./crates/gateway-local-data/Cargo.lock
        --lockfile=./apps/desktop/package-lock.json
        --lockfile=./scripts/package-lock.json
      upload-sarif: true
      fail-on-vuln: true
    permissions:
      actions: read
      contents: read
      security-events: write

  secrets:
    name: Scan repository secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # This pinned action invokes Gitleaks with --redact.
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_ENABLE_COMMENTS: "false"
