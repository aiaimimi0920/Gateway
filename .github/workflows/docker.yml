name: Docker

on:
  push:
    branches:
      - main
    tags:
      - 'V*.*.*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: gateway-docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/aiaimimi0920/gateway
  # Pull requests always build without publishing. Main/tag pushes, including
  # an explicitly dispatched run on those refs, may publish to GHCR.
  PUBLISH_IMAGE: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/V')) }}

jobs:
  security:
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ github.sha }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write

  docker:
    name: Build and optionally publish Gateway image
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.security.outputs.source_sha }}

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^V[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match Vx.y.z. Received: $tag" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: |
            scripts/package-lock.json
            apps/desktop/package-lock.json

      - name: Install browser worker dependencies
        run: npm ci --prefix scripts --no-audit --no-fund

      - name: Audit browser worker production dependencies
        run: npm run audit:prod --prefix scripts

      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop --no-audit --no-fund

      - name: Audit desktop production dependencies
        run: npm run audit:prod --prefix apps/desktop

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Docker verification tag
        id: verify_tag
        shell: bash
        run: |
          echo "tag=verify-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build Gateway image for Docker stack verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.verify_tag.outputs.tag }}
          build-args: |
            GATEWAY_AUDIT_NONCE=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker deployment stack
        shell: pwsh
        run: |
          ./tools/verify-gateway-docker-stack.ps1 `
            -ImageTag '${{ steps.verify_tag.outputs.tag }}' `
            -StartupTimeoutSeconds 300

      - name: Build and optionally publish Gateway image
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GATEWAY_AUDIT_NONCE=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
