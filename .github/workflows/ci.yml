name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows product validation
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The effective-line baseline records the pre-adoption source commit.
          fetch-depth: 0

      - name: Use runner-local temporary storage
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $gatewayTemp = Join-Path $env:RUNNER_TEMP "gateway-ci-temp"
          New-Item -ItemType Directory -Force -Path $gatewayTemp | Out-Null
          "TEMP=$gatewayTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$gatewayTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python validation dependencies
        run: python -m pip install --disable-pip-version-check -r tests/python/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: |
            scripts/package-lock.json
            apps/desktop/package-lock.json

      - name: Test effective-code-line checker
        run: npm run test:effective-lines --prefix scripts

      - name: Enforce effective-code-line migration ratchet
        run: npm run check:effective-lines --prefix scripts

      - name: Upload effective-code-line report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gateway-effective-code-lines-windows
          path: artifacts/effective-code-lines.json
          if-no-files-found: warn

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Install browser worker dependencies
        run: npm ci --prefix scripts --no-audit --no-fund

      - name: Audit browser worker production dependencies
        run: npm run audit:prod --prefix scripts

      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop --no-audit --no-fund

      - name: Audit desktop production dependencies
        run: npm run audit:prod --prefix apps/desktop

      - name: Test desktop frontend
        working-directory: apps/desktop
        run: npm test -- --run

      - name: Validate provider manifests
        run: python tools/validate-gateway-line-manifests.py

      - name: Run python-tests
        run: python -m unittest discover -s tests/python -p "test_*.py" -v

      - name: Run gateway-line-matrix
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $sharedTarget = Join-Path $env:RUNNER_TEMP "gateway-line-targets"
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\verify-gateway-line.ps1 `
            -All -LibOnly -SharedCargoTargetDir $sharedTarget

      - name: Run live provider canary preflight
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\invoke-gateway-live-provider-canary.ps1 -AsJson

      - name: Run browser-worker-tests
        run: node --test scripts/tests/*.test.mjs

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Rust targets
        run: cargo check --locked --all-targets

      - name: Test Rust gateway
        run: cargo test --locked -- --test-threads=1

      - name: Typecheck desktop frontend
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Check Tauri formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Check Tauri wrapper
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

  linux:
    name: Linux product validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The effective-line baseline records the pre-adoption source commit.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python validation dependencies
        run: python -m pip install --disable-pip-version-check -r tests/python/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: |
            scripts/package-lock.json
            apps/desktop/package-lock.json

      - name: Test effective-code-line checker
        run: npm run test:effective-lines --prefix scripts

      - name: Enforce effective-code-line migration ratchet
        run: npm run check:effective-lines --prefix scripts

      - name: Upload effective-code-line report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gateway-effective-code-lines-linux
          path: artifacts/effective-code-lines.json
          if-no-files-found: warn

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            cmake \
            libayatana-appindicator3-dev \
            libxdo-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config

      - name: Install browser worker dependencies
        run: npm ci --prefix scripts --no-audit --no-fund

      - name: Audit browser worker production dependencies
        run: npm run audit:prod --prefix scripts

      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop --no-audit --no-fund

      - name: Audit desktop production dependencies
        run: npm run audit:prod --prefix apps/desktop

      - name: Test desktop frontend
        working-directory: apps/desktop
        run: npm test -- --run

      - name: Validate provider manifests
        run: python tools/validate-gateway-line-manifests.py

      - name: Validate standalone repository contract
        run: python -m unittest discover -s tests/python -p "test_gateway_standalone*.py" -v

      - name: Run browser-worker-tests
        run: node --test scripts/tests/*.test.mjs

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Rust targets
        run: cargo check --locked --all-targets

      - name: Test Rust gateway
        run: cargo test --locked -- --test-threads=1

      - name: Typecheck desktop frontend
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Check Tauri formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Check Tauri wrapper
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
