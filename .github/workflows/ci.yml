name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

concurrency:
  group: gateway-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  line-plan:
    name: Plan feature-line coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_matrix: ${{ steps.plan.outputs.run_matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - id: plan
        run: python tools/plan-gateway-line-matrix.py

  line-matrix:
    name: Windows feature lines (${{ matrix.shard }}/6)
    needs: line-plan
    if: needs.line-plan.outputs.run_matrix == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # Feature-coverage binaries are not release/debug artifacts; keep caches and links small.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check -r tests/python/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: |
            scripts/package-lock.json
            apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Cache feature-line build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target/line-matrix
          # Keep feature variants separate; do not cache only the default target.
          key: lines-v1-${{ matrix.shard }}-${{ hashFiles('src/**/*.rs', 'crates/**/*.rs', 'build.rs', 'build_support/**', 'manifests/**') }}
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci --prefix scripts --no-audit --no-fund
      - run: npm ci --prefix apps/desktop --no-audit --no-fund
      - name: Run gateway-line-matrix shard
        shell: powershell
        env:
          LINE_SHARD: ${{ matrix.shard }}
        run: |
          $ErrorActionPreference = "Stop"
          $sharedTarget = Join-Path $env:GITHUB_WORKSPACE "target/line-matrix"
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\verify-gateway-line.ps1 `
            -All -LibOnly -SharedCargoTargetDir $sharedTarget -ShardIndex $env:LINE_SHARD -ShardCount 6

  line-coverage:
    # Preserve the existing required-check name while product tests and features run in parallel.
    name: Windows product validation
    needs: [line-plan, line-matrix, windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject failed, cancelled or unexpectedly skipped coverage
        env:
          PLAN_RESULT: ${{ needs.line-plan.result }}
          PRODUCT_RESULT: ${{ needs.windows.result }}
          RUN_MATRIX: ${{ needs.line-plan.outputs.run_matrix }}
          MATRIX_RESULT: ${{ needs.line-matrix.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$PRODUCT_RESULT" = success
          if [ "$RUN_MATRIX" = true ]; then
            test "$MATRIX_RESULT" = success
          else
            test "$RUN_MATRIX" = false
            test "$MATRIX_RESULT" = skipped
          fi

  windows:
    name: Windows product tests
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The effective-line baseline records the pre-adoption source commit.
          fetch-depth: 0

      - name: Use runner-local temporary storage
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $gatewayTemp = Join-Path $env:RUNNER_TEMP "gateway-ci-temp"
          New-Item -ItemType Directory -Force -Path $gatewayTemp | Out-Null
          "TEMP=$gatewayTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$gatewayTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python validation dependencies
        run: python -m pip install --disable-pip-version-check -r tests/python/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: |
            scripts/package-lock.json
            apps/desktop/package-lock.json

      - name: Test effective-code-line checker
        run: npm run test:effective-lines --prefix scripts

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Install browser worker dependencies
        run: npm ci --prefix scripts --no-audit --no-fund

      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop --no-audit --no-fund

      - name: Test desktop frontend
        working-directory: apps/desktop
        run: npm test -- --run

      - name: Validate provider manifests
        run: python tools/validate-gateway-line-manifests.py

      - name: Run python-tests
        run: python -m unittest discover -s tests/python -p "test_*.py" -v

      - name: Run live provider canary preflight
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\invoke-gateway-live-provider-canary.ps1 -AsJson

      - name: Run browser-worker-tests
        run: node --test scripts/tests/*.test.mjs

      - name: Check Rust targets
        run: cargo check --locked --all-targets

      - name: Test Rust gateway
        run: cargo test --locked -- --test-threads=1

      - name: Typecheck desktop frontend
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Check Tauri wrapper
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

  linux:
    name: Linux product validation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The effective-line baseline records the pre-adoption source commit.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python validation dependencies
        run: python -m pip install --disable-pip-version-check -r tests/python/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: |
            scripts/package-lock.json
            apps/desktop/package-lock.json

      - name: Test effective-code-line checker
        run: npm run test:effective-lines --prefix scripts

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            cmake \
            libayatana-appindicator3-dev \
            libxdo-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config

      - name: Install browser worker dependencies
        run: npm ci --prefix scripts --no-audit --no-fund

      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop --no-audit --no-fund

      - name: Test desktop frontend
        working-directory: apps/desktop
        run: npm test -- --run

      - name: Validate provider manifests
        run: python tools/validate-gateway-line-manifests.py

      - name: Validate standalone repository contract
        run: python -m unittest discover -s tests/python -p "test_gateway_standalone*.py" -v

      - name: Run browser-worker-tests
        run: node --test scripts/tests/*.test.mjs

      - name: Check Rust targets
        run: cargo check --locked --all-targets

      - name: Test Rust gateway
        run: cargo test --locked -- --test-threads=1

      - name: Typecheck desktop frontend
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Check Tauri wrapper
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

  quality:
    name: Development report (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [npm-scripts, npm-desktop, format, lines]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
      - name: Setup formatter
        if: matrix.check == 'format'
        uses: dtolnay/rust-toolchain@4dfd137a5aecc12897f37a01818006f58cf58347 # Rust 1.98.0
        with:
          components: rustfmt
      - name: Generate validated advisory report
        env:
          QUALITY_CHECK: ${{ matrix.check }}
        run: node scripts/development-quality.mjs "$QUALITY_CHECK"
      - name: Upload complete report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: development-quality-${{ matrix.check }}
          path: artifacts/quality-${{ matrix.check }}/report.json
          if-no-files-found: error
