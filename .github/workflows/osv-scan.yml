name: OSV scan

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      enforce_findings:
        type: boolean
        default: true
    outputs:
      findings_free:
        value: ${{ jobs.osv-scan.outputs.findings_free }}

permissions:
  contents: read

jobs:
  # Keep this terminal job key: GitHub uses outer workflow + job for analysis identity.
  osv-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    outputs:
      findings_free: ${{ steps.scan.outputs.findings_free }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
      - name: Install verified OSV 2.5.1
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64 \
            --output "$RUNNER_TEMP/osv-scanner"
          echo "f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Scan all five locks and validate complete JSON and SARIF
        id: scan
        run: node scripts/security-scan.mjs osv "$RUNNER_TEMP/osv-scanner" "$RUNNER_TEMP/gateway-osv"
      - name: Preserve validated reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-${{ github.workflow }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gateway-osv
          if-no-files-found: error
      - name: Upload complete SARIF
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: ${{ runner.temp }}/gateway-osv/results.sarif
          wait-for-processing: true
      - name: Enforce findings for release callers
        if: inputs.enforce_findings && steps.scan.outputs.findings_free != 'true'
        run: |
          echo "Release blocked by validated dependency findings; see complete reports."
          exit 1
